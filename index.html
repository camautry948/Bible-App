<title>The Journey — Bible Reading</title>
<style>
:root{--bg:#f7f1e7;--card:#ffffff;--card2:#efe8dc;--text:#14273d;--muted:#6b7785;--accent:#2f7d76;--accentText:#fff;--gold:#c99a45;--border:#ded7cc;--shadow:0 10px 30px rgba(20,39,61,.07);--danger:#a34343}
html[data-theme="dark"]{--bg:#0c1724;--card:#142233;--card2:#1a2a3d;--text:#f6f0e5;--muted:#aab5c0;--accent:#5fa79d;--accentText:#0c1724;--gold:#d8ad60;--border:#2a3b4e;--shadow:0 12px 32px rgba(0,0,0,.2);--danger:#e68a8a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:background .25s,color .25s}button,input,select,textarea{font:inherit}.app{max-width:760px;margin:0 auto;padding:env(safe-area-inset-top) 16px calc(92px + env(safe-area-inset-bottom))}.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 12px;gap:12px}.brand{font-weight:800;letter-spacing:-.03em;font-size:23px}.brand small{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;margin-top:2px}.iconbtn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:14px;min-width:44px;height:44px;padding:0 12px}.screen{display:none}.screen.active{display:block}.hero{padding:22px;border-radius:26px;background:linear-gradient(145deg,var(--card),var(--card2));box-shadow:var(--shadow);border:1px solid var(--border)}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);font-weight:800}.hero h1{font-size:31px;line-height:1.08;margin:8px 0 8px;letter-spacing:-.04em}.sub{color:var(--muted);line-height:1.5}.primary{width:100%;min-height:52px;border:0;border-radius:16px;background:var(--accent);color:var(--accentText);font-weight:800;padding:14px 18px}.secondary{width:100%;min-height:48px;border:1px solid var(--border);border-radius:16px;background:var(--card);color:var(--text);font-weight:750;padding:12px 16px}.ghost{border:0;background:transparent;color:var(--accent);font-weight:800;min-height:44px;padding:8px 10px}.grid{display:grid;gap:12px}.cards{margin-top:14px}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:17px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 7px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.progress{height:9px;border-radius:999px;background:var(--card2);overflow:hidden;margin:12px 0}.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:999px}.pill{display:inline-flex;align-items:center;border:1px solid var(--border);background:var(--card2);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:750;color:var(--muted)}.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(760px,100%);padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 92%, transparent);backdrop-filter:blur(18px);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);z-index:30}.nav button{border:0;background:transparent;color:var(--muted);padding:8px 4px;min-height:54px;font-size:11px;font-weight:750}.nav button.active{color:var(--accent)}.nav .ico{font-size:20px;display:block;margin-bottom:2px}.readerOverlay,.modal{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;overflow:auto}.readerOverlay.active,.modal.active{display:block}.readerWrap{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 18px calc(24px + env(safe-area-inset-bottom))}.readerHead{position:sticky;top:0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(16px);padding:10px 0;z-index:2}.readerTitle{font-size:19px;font-weight:850}.readerText{font-family:Georgia,"Times New Roman",serif;font-size:21px;line-height:1.75;letter-spacing:.003em;padding:14px 2px 120px}.verse{display:block;margin-bottom:10px}.vnum{font-family:Inter,sans-serif;font-size:10px;color:var(--gold);vertical-align:super;font-weight:800;margin-right:5px}.readerBottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);padding:10px 18px calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--border)}.fields{display:grid;gap:12px}.field label{display:block;font-size:13px;font-weight:800;margin:0 0 6px}.field input,.field select,.field textarea{width:100%;min-height:48px;border:1px solid var(--border);border-radius:14px;background:var(--card);color:var(--text);padding:12px 13px;font-size:16px}.field textarea{min-height:120px;resize:vertical}.seglist{display:grid;gap:8px;margin-top:12px}.segment{display:flex;align-items:center;gap:12px;padding:11px;border-radius:15px;background:var(--card2)}.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--border);font-size:12px;font-weight:800;flex:0 0 auto}.segment.done .dot{background:var(--accent);color:var(--accentText);border-color:var(--accent)}.small{font-size:12px;color:var(--muted)}.bookgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bookbtn{min-height:48px;border:1px solid var(--border);border-radius:14px;background:var(--card);color:var(--text);text-align:left;padding:12px;font-weight:750}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:11px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:90;max-width:90%;text-align:center;font-size:13px;font-weight:700}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.qCard{padding:18px;border-radius:20px;background:var(--card);border:1px solid var(--border)}.answers{display:grid;gap:9px;margin-top:14px}.ans{border:1px solid var(--border);background:var(--card2);color:var(--text);border-radius:14px;padding:13px;text-align:left;min-height:48px}.ans.selected{outline:2px solid var(--accent)}.milestone{border-left:3px solid var(--border);padding:4px 0 18px 16px;margin-left:10px}.milestone.active{border-left-color:var(--accent)}.milestone.done{border-left-color:var(--gold)}.center{text-align:center}.hide{display:none!important}.notice{border:1px solid var(--border);background:var(--card2);padding:12px;border-radius:14px;color:var(--muted);font-size:13px;line-height:1.45}.setupChoice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.setupChoice button{min-height:100px;border-radius:18px;border:1px solid var(--border);background:var(--card);color:var(--text);padding:14px;font-weight:800}.setupChoice button.selected{outline:2px solid var(--accent);background:var(--card2)}@media(max-width:430px){.hero h1{font-size:28px}.readerText{font-size:20px}.bookgrid{grid-template-columns:1fr}.setupChoice{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar"><div class="brand">The Journey<small>Read the Bible • a little at a time</small></div><button class="iconbtn" id="settingsBtn" aria-label="Settings">⚙︎</button></header>

  <section class="screen active" id="todayScreen">
    <div id="todayContent"></div>
  </section>

  <section class="screen" id="bibleScreen">
    <div class="hero"><div class="eyebrow">Bible</div><h1>Read anywhere.</h1><p class="sub">Browsing here never changes your Journey progress.</p></div>
    <div class="card cards">
      <div class="fields">
        <div class="field"><label for="bookSelect">Book</label><select id="bookSelect"></select></div>
        <div class="field"><label for="chapterSelect">Chapter</label><select id="chapterSelect"></select></div>
        <button class="primary" id="openChapterBtn">Open chapter</button>
      </div>
    </div>
    <div class="card cards">
      <h3>Quick reference</h3><div class="fields"><div class="field"><label for="referenceInput">Passage</label><input id="referenceInput" placeholder="John 3:16 or Psalm 23" /></div><button class="secondary" id="openReferenceBtn">Open passage</button></div>
    </div>
  </section>

  <section class="screen" id="journeyScreen"><div id="journeyContent"></div></section>
  <section class="screen" id="journalScreen"><div id="journalContent"></div></section>

  <nav class="nav" aria-label="Main navigation">
    <button data-screen="todayScreen" class="active"><span class="ico">⌂</span>Today</button>
    <button data-screen="bibleScreen"><span class="ico">☰</span>Bible</button>
    <button data-screen="journeyScreen"><span class="ico">◉</span>Journey</button>
    <button data-screen="journalScreen"><span class="ico">✎</span>Journal</button>
  </nav>
</div>

<div class="readerOverlay" id="readerOverlay" aria-modal="true" role="dialog">
 <div class="readerWrap">
  <div class="readerHead"><div class="row"><button class="iconbtn" id="readerBack">←</button><div class="readerTitle" id="readerTitle">Loading…</div><button class="iconbtn" id="fontBtn">Aa</button></div></div>
  <div class="readerText" id="readerText"><p class="sub">Loading Scripture…</p></div>
 </div>
 <div class="readerBottom" id="readerBottom"></div>
</div>

<div class="modal" id="settingsModal" aria-modal="true" role="dialog"><div class="readerWrap"><div class="readerHead"><div class="row"><button class="iconbtn" id="settingsClose">←</button><div class="readerTitle">Settings</div><span style="width:44px"></span></div></div><div id="settingsContent"></div></div></div>
<div class="modal" id="reflectionModal" aria-modal="true" role="dialog"><div class="readerWrap"><div class="readerHead"><div class="row"><button class="iconbtn" id="reflectionClose">←</button><div class="readerTitle">Daily Reflection</div><span style="width:44px"></span></div></div><div id="reflectionContent"></div></div></div>
<div class="modal" id="onboardingModal" aria-modal="true" role="dialog"><div class="readerWrap"><div id="onboardingContent"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const BIBLE_BOOKS=[['Genesis',50],['Exodus',40],['Leviticus',27],['Numbers',36],['Deuteronomy',34],['Joshua',24],['Judges',21],['Ruth',4],['1 Samuel',31],['2 Samuel',24],['1 Kings',22],['2 Kings',25],['1 Chronicles',29],['2 Chronicles',36],['Ezra',10],['Nehemiah',13],['Esther',10],['Job',42],['Psalms',150],['Proverbs',31],['Ecclesiastes',12],['Song of Solomon',8],['Isaiah',66],['Jeremiah',52],['Lamentations',5],['Ezekiel',48],['Daniel',12],['Hosea',14],['Joel',3],['Amos',9],['Obadiah',1],['Jonah',4],['Micah',7],['Nahum',3],['Habakkuk',3],['Zephaniah',3],['Haggai',2],['Zechariah',14],['Malachi',4],['Matthew',28],['Mark',16],['Luke',24],['John',21],['Acts',28],['Romans',16],['1 Corinthians',16],['2 Corinthians',13],['Galatians',6],['Ephesians',6],['Philippians',4],['Colossians',4],['1 Thessalonians',5],['2 Thessalonians',3],['1 Timothy',6],['2 Timothy',4],['Titus',3],['Philemon',1],['Hebrews',13],['James',5],['1 Peter',5],['2 Peter',3],['1 John',5],['2 John',1],['3 John',1],['Jude',1],['Revelation',22]];

const PLAN=[
{day:1,title:'Creation and the Fall',range:'Genesis 1–3',intro:'The Bible opens with creation, humanity’s purpose, and the first rupture between people and God. Watch how quickly the story moves from goodness to brokenness.',segments:[['Genesis 1:1-19','3 min'],['Genesis 1:20-2:3','3 min'],['Genesis 2:4-25','4 min'],['Genesis 3','4 min']],questions:[{type:'mc',q:'What did God call the light?',a:['Day','Sky','Earth','Morning'],correct:0},{type:'mc',q:'Where did God place the man?',a:['Egypt','The garden of Eden','Canaan','Jerusalem'],correct:1},{type:'text',q:'What part of the creation story stood out to you most?'},{type:'text',q:'What do you want to remember or pray about from today’s reading?'}]},
{day:2,title:'Cain, Humanity and Noah',range:'Genesis 4–7',intro:'Sin spreads beyond Eden, but the story also begins tracing a line of faith and preservation. Notice the contrast between violence and Noah’s obedience.',segments:[['Genesis 4','4 min'],['Genesis 5','4 min'],['Genesis 6','4 min'],['Genesis 7','4 min']],questions:[{type:'mc',q:'Who were Cain and Abel?',a:['Brothers','Kings','Priests','Prophets'],correct:0},{type:'mc',q:'Why did Noah build the ark?',a:['To cross a sea','God warned of a flood','To store grain','To escape a war'],correct:1},{type:'text',q:'What contrast did you notice between human choices and Noah’s response?'},{type:'text',q:'Write one thought you want to carry into tomorrow.'}]},
{day:3,title:'Flood, Covenant and Babel',range:'Genesis 8–11',intro:'The flood ends, God establishes a covenant, and humanity begins again. Then Babel shows that old patterns of pride have not disappeared.',segments:[['Genesis 8','4 min'],['Genesis 9','4 min'],['Genesis 10','4 min'],['Genesis 11','4 min']],questions:[{type:'mc',q:'What sign is connected with God’s covenant after the flood?',a:['A star','A rainbow','A pillar of fire','A crown'],correct:1},{type:'mc',q:'What were the people building at Babel?',a:['An ark','A temple in Jerusalem','A city and tower','A palace for Abraham'],correct:2},{type:'text',q:'What do these chapters show about fresh starts and human nature?'},{type:'text',q:'What is one thing you want to reflect on from today?'}]},
{day:4,title:'Job’s Suffering Begins',range:'Job 1–5',intro:'Job introduces a different kind of story: a faithful man faces devastating loss without understanding why. Pay attention to what Job knows—and what he does not know.',segments:[['Job 1','4 min'],['Job 2','3 min'],['Job 3','4 min'],['Job 4','4 min'],['Job 5','4 min']],questions:[{type:'mc',q:'How is Job described at the beginning?',a:['A king','Blameless and upright','A priest in Jerusalem','A soldier'],correct:1},{type:'mc',q:'Who comes to sit with Job after his suffering?',a:['His friends','Pharaoh','Moses','Abraham'],correct:0},{type:'text',q:'What did you notice about Job’s first responses to suffering?'},{type:'text',q:'What question from this reading would you want to explore further?'}]},
{day:5,title:'Job Responds',range:'Job 6–9',intro:'Job answers his friends honestly. The conversation wrestles with pain, fairness, and the distance Job feels between himself and God.',segments:[['Job 6','4 min'],['Job 7','4 min'],['Job 8','4 min'],['Job 9','5 min']],questions:[{type:'mc',q:'Who answers Job in chapter 8?',a:['Bildad','David','Noah','Solomon'],correct:0},{type:'text',q:'How does Job describe what his suffering feels like?'},{type:'text',q:'What did you notice about the assumptions Job’s friends make?'},{type:'text',q:'Write a short reflection or prayer from today’s reading.'}]},
{day:6,title:'Wrestling With Suffering',range:'Job 10–13',intro:'Job continues to speak candidly, both to his friends and toward God. Notice how lament can include both confusion and continued engagement with God.',segments:[['Job 10','4 min'],['Job 11','4 min'],['Job 12','4 min'],['Job 13','4 min']],questions:[{type:'mc',q:'Who speaks to Job in chapter 11?',a:['Zophar','Samuel','Isaiah','Peter'],correct:0},{type:'text',q:'Which statement in these chapters best captures Job’s struggle?'},{type:'text',q:'What do you learn from the way Job keeps bringing his questions to God?'},{type:'text',q:'What do you want to remember from today?'}]},
{day:7,title:'Mortality and Hope',range:'Job 14–16',intro:'Job reflects on the brevity of life while the debate with his friends intensifies. Look for both despair and the small openings where hope still appears.',segments:[['Job 14','4 min'],['Job 15','5 min'],['Job 16','4 min']],questions:[{type:'mc',q:'What image does Job use for the shortness of human life?',a:['A mountain','A flower','A fortress','A river'],correct:1},{type:'text',q:'Where did you notice hope appearing alongside grief?'},{type:'text',q:'How could a friend respond differently than Job’s friends do?'},{type:'text',q:'Write one sentence you want to keep from today’s reflection.'}]},
{day:8,title:'The Debate Continues',range:'Job 17–20',intro:'Job and his friends keep circling the question of suffering and justice. Notice how certainty can become harmful when someone does not fully understand another person’s situation.',segments:[['Job 17','3 min'],['Job 18','4 min'],['Job 19','5 min'],['Job 20','4 min']],questions:[{type:'text',q:'What do Job’s friends seem most certain about?'},{type:'text',q:'How does Job push back against their explanations?'},{type:'text',q:'What do these chapters teach about listening before explaining?'},{type:'text',q:'What stood out to you today?'}]},
{day:9,title:'Job Seeks God',range:'Job 21–23',intro:'Job challenges simple explanations of justice and longs to bring his case before God. The questions become sharper, but so does his desire to encounter God directly.',segments:[['Job 21','5 min'],['Job 22','4 min'],['Job 23','4 min']],questions:[{type:'mc',q:'What does Job say he wants to find in chapter 23?',a:['A new home','God','A king','His lost possessions'],correct:1},{type:'text',q:'What question about justice is Job pressing in these chapters?'},{type:'text',q:'How does Job’s desire to find God shape the reading?'},{type:'text',q:'Write a brief reflection from today.'}]},
{day:10,title:'Wisdom',range:'Job 24–28',intro:'The debate broadens into questions of justice and wisdom. Chapter 28 becomes a striking meditation on where true wisdom can actually be found.',segments:[['Job 24','4 min'],['Job 25-26','4 min'],['Job 27','4 min'],['Job 28','4 min']],questions:[{type:'mc',q:'According to Job 28, where does wisdom ultimately come from?',a:['Wealth','Human strength','God','Age alone'],correct:2},{type:'text',q:'How is wisdom described differently from material treasure?'},{type:'text',q:'What part of Job 28 would you want to remember?'},{type:'text',q:'Write a short prayer or reflection about wisdom.'}]}
];

const storeKey='journeyBiblePrototype_v1';
const defaults={onboarded:false,readingMode:'short',reminder:'2h',theme:'auto',eveningHour:19,morningHour:7,currentDay:1,completed:{},journal:[],fontSize:21};
let state=Object.assign({},defaults,JSON.parse(localStorage.getItem(storeKey)||'{}'));
let activeReader=null;let reminderTimer=null;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function save(){localStorage.setItem(storeKey,JSON.stringify(state));renderToday();renderJourney();renderJournal();}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function applyTheme(){let t=state.theme;if(t==='auto'){const h=new Date().getHours();t=(h>=state.eveningHour||h<state.morningHour)?'dark':'light'}document.documentElement.dataset.theme=t==='dark'?'dark':'light';$('#themeMeta').content=t==='dark'?'#0c1724':'#f7f1e7'}
setInterval(applyTheme,60000);applyTheme();
function dayObj(){return PLAN.find(x=>x.day===state.currentDay)||PLAN[PLAN.length-1]}
function segDone(day,i){return !!state.completed[`${day}:${i}`]}
function dayDone(day){const d=PLAN.find(x=>x.day===day);return d?d.segments.every((_,i)=>segDone(day,i)):false}
function pct(){let done=0,total=0;PLAN.forEach(d=>{d.segments.forEach((_,i)=>{total++;if(segDone(d.day,i))done++})});return total?Math.round(done/total*100):0}
function nextSegment(d=dayObj()){let i=d.segments.findIndex((_,i)=>!segDone(d.day,i));return i<0?null:i}
function renderToday(){const d=dayObj(), next=nextSegment(d), completed=d.segments.filter((_,i)=>segDone(d.day,i)).length, p=Math.round(completed/d.segments.length*100);$('#todayContent').innerHTML=`
<div class="hero"><div class="eyebrow">Reading ${d.day} of 365</div><h1>${d.title}</h1><p class="sub">${d.range}</p><div class="progress"><span style="width:${p}%"></span></div><div class="row"><span class="pill">${completed} of ${d.segments.length} parts</span><span class="small">${next===null?'Scripture complete':d.segments[next][1]+' next'}</span></div><div style="height:14px"></div>${next===null?`<button class="primary" id="reflectBtn">Continue to reflection</button>`:`<button class="primary" id="continueBtn">${completed?'Continue Reading':'Start Reading'}</button>`}</div>
<div class="card cards"><div class="eyebrow">Before you read</div><h3 style="margin-top:7px">${d.title}</h3><p class="sub">${d.intro}</p></div>
<div class="card cards"><div class="row"><h3>Today’s parts</h3><span class="pill">${d.segments.reduce((n,s)=>n+parseInt(s[1]),0)} min approx.</span></div><div class="seglist">${d.segments.map((s,i)=>`<div class="segment ${segDone(d.day,i)?'done':''}"><span class="dot">${segDone(d.day,i)?'✓':i+1}</span><div style="min-width:0;flex:1"><strong>${s[0]}</strong><div class="small">${s[1]}</div></div><button class="ghost openSeg" data-i="${i}">${segDone(d.day,i)?'Read again':'Read'}</button></div>`).join('')}</div></div>
<div class="card cards"><div class="row"><div><div class="eyebrow">Your journey</div><h3 style="margin-top:6px">${pct()}% through the prototype content</h3></div><span class="pill">${state.currentDay}/365</span></div><p class="small">The test build contains the first 10 readings. The production plan will contain all 365.</p></div>`;
$('#continueBtn')?.addEventListener('click',()=>openPlanSegment(d.day,next));$('#reflectBtn')?.addEventListener('click',()=>openReflection(d.day));$$('.openSeg').forEach(b=>b.addEventListener('click',()=>openPlanSegment(d.day,+b.dataset.i)))}

async function fetchPassage(ref){const url='https://bible-api.com/'+encodeURIComponent(ref)+'?translation=web';const r=await fetch(url);if(!r.ok)throw new Error('Scripture service unavailable');return await r.json()}
function openPlanSegment(day,i){const d=PLAN.find(x=>x.day===day);openReader(d.segments[i][0],{day,i,plan:true})}
async function openReader(ref,meta={plan:false}){activeReader={ref,...meta};$('#readerOverlay').classList.add('active');$('#readerTitle').textContent=ref;$('#readerText').innerHTML='<p class="sub">Loading Scripture…</p>';$('#readerText').style.fontSize=state.fontSize+'px';$('#readerBottom').innerHTML=meta.plan?'<button class="primary" disabled>Loading…</button>':'<button class="secondary" id="closeReaderBottom">Close</button>';try{const data=await fetchPassage(ref);$('#readerTitle').textContent=data.reference||ref;const verses=data.verses||[];$('#readerText').innerHTML=verses.map(v=>`<span class="verse"><sup class="vnum">${v.verse}</sup>${escapeHtml(v.text.trim())}</span>`).join('')||`<p>${escapeHtml(data.text||'No text returned.')}</p>`;if(meta.plan){$('#readerBottom').innerHTML=`<button class="primary" id="finishSegBtn">${segDone(meta.day,meta.i)?'Close reading':'Finish this reading'}</button>`;$('#finishSegBtn').addEventListener('click',()=>{if(!segDone(meta.day,meta.i)){state.completed[`${meta.day}:${meta.i}`]=true;save();toast('Reading saved ✓')}closeReader();const d=PLAN.find(x=>x.day===meta.day);if(dayDone(meta.day))setTimeout(()=>openReflection(meta.day),250)})}else{$('#readerBottom').innerHTML='<button class="secondary" id="closeReaderBottom">Close</button>';$('#closeReaderBottom').onclick=closeReader}}catch(e){$('#readerText').innerHTML=`<div class="notice"><strong>Couldn’t load this passage.</strong><br>This prototype retrieves the public-domain World English Bible online. Check the connection and try again.</div>`;$('#readerBottom').innerHTML='<button class="secondary" id="retryReader">Try again</button>';$('#retryReader').onclick=()=>openReader(ref,meta)}}
function closeReader(){$('#readerOverlay').classList.remove('active');activeReader=null}
$('#readerBack').onclick=closeReader;$('#fontBtn').onclick=()=>{state.fontSize=state.fontSize>=25?18:state.fontSize+1;save();$('#readerText').style.fontSize=state.fontSize+'px';toast('Text size '+state.fontSize)};

function renderJourney(){const eras=[['Beginnings',[1,2,3]],['Job',[4,5,6,7,8,9,10]],['The Patriarchs',[]],['Exodus',[]],['Kingdom',[]],['Exile & Return',[]],['Jesus & Early Church',[]]];$('#journeyContent').innerHTML=`<div class="hero"><div class="eyebrow">Your journey</div><h1>Reading ${state.currentDay} of 365</h1><p class="sub">Progress is based on completed Scripture, not calendar streaks.</p><div class="progress"><span style="width:${Math.min(100,state.currentDay/365*100)}%"></span></div></div><div class="card cards">${eras.map(([name,days])=>{const done=days.length&&days.every(dayDone),active=days.includes(state.currentDay);return `<div class="milestone ${done?'done':active?'active':''}"><strong>${done?'✓ ':active?'● ':''}${name}</strong>${days.length?`<div class="small">${days.filter(dayDone).length} of ${days.length} prototype readings complete</div>`:'<div class="small">Included in the full 365-day plan</div>'}</div>`}).join('')}</div><div class="card cards"><h3>Prototype reading history</h3><div class="seglist">${PLAN.map(d=>`<div class="segment ${dayDone(d.day)?'done':''}"><span class="dot">${dayDone(d.day)?'✓':d.day}</span><div style="flex:1"><strong>${d.title}</strong><div class="small">${d.range}</div></div>${d.day===state.currentDay?'<span class="pill">Current</span>':''}</div>`).join('')}</div></div>`}

function renderJournal(){const entries=[...state.journal].reverse();$('#journalContent').innerHTML=`<div class="hero"><div class="eyebrow">Journal</div><h1>Your reflections.</h1><p class="sub">Saved only in this browser in the prototype.</p></div>${entries.length?entries.map(e=>`<div class="card cards"><div class="row"><div><div class="eyebrow">Reading ${e.day}</div><h3 style="margin-top:5px">${escapeHtml(e.title)}</h3></div><span class="small">${new Date(e.savedAt).toLocaleDateString()}</span></div>${e.answers.filter(a=>a.text).map(a=>`<div style="margin-top:14px"><strong>${escapeHtml(a.q)}</strong><p class="sub" style="margin-bottom:0">${escapeHtml(a.text)}</p></div>`).join('')}</div>`).join(''):`<div class="card cards center"><h3>No journal entries yet</h3><p class="sub">Complete a reading and save a reflection. Text entries take very little storage.</p></div>`}`}

let reflectionState={};function openReflection(day){const d=PLAN.find(x=>x.day===day);if(!d)return;reflectionState={day,index:0,answers:[]};$('#reflectionModal').classList.add('active');renderReflection()}
function renderReflection(){const d=PLAN.find(x=>x.day===reflectionState.day),q=d.questions[reflectionState.index],n=d.questions.length;$('#reflectionContent').innerHTML=`<div class="hero"><div class="eyebrow">Question ${reflectionState.index+1} of ${n}</div><h1 style="font-size:27px">${escapeHtml(q.q)}</h1><p class="sub">${q.type==='text'?'Take your time. You can also skip this question.':'Choose the best answer.'}</p></div><div class="qCard cards">${q.type==='mc'?`<div class="answers">${q.a.map((a,i)=>`<button class="ans" data-a="${i}">${escapeHtml(a)}</button>`).join('')}</div>`:`<div class="field"><label for="reflectionText">Your reflection</label><textarea id="reflectionText" placeholder="Write your thoughts…"></textarea></div>`}<div style="height:14px"></div><div class="grid"><button class="primary" id="nextQ">${reflectionState.index===n-1?'Save reflection':'Next question'}</button><button class="ghost" id="skipQ">Skip</button></div></div>`;let selected=null;$$('.ans').forEach(b=>b.onclick=()=>{$$('.ans').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=+b.dataset.a});$('#nextQ').onclick=()=>{let text='';if(q.type==='text')text=$('#reflectionText').value.trim();else if(selected!==null)text=q.a[selected];reflectionState.answers.push({q:q.q,text});advanceReflection(d)};$('#skipQ').onclick=()=>{reflectionState.answers.push({q:q.q,text:''});advanceReflection(d)}}
function advanceReflection(d){if(reflectionState.index<d.questions.length-1){reflectionState.index++;renderReflection();return}state.journal=state.journal.filter(e=>e.day!==d.day);state.journal.push({day:d.day,title:d.title,answers:reflectionState.answers,savedAt:new Date().toISOString()});if(state.currentDay===d.day && state.currentDay<365)state.currentDay++;save();$('#reflectionModal').classList.remove('active');toast('Reflection saved ✓')}
$('#reflectionClose').onclick=()=>$('#reflectionModal').classList.remove('active');

function renderSettings(){const secure=window.isSecureContext;$('#settingsContent').innerHTML=`<div class="card"><h3>Reading style</h3><div class="fields"><div class="field"><label>Mode</label><select id="readingMode"><option value="short" ${state.readingMode==='short'?'selected':''}>Short readings throughout the day</option><option value="daily" ${state.readingMode==='daily'?'selected':''}>One daily reading</option></select></div><div class="field"><label>Reminder frequency</label><select id="reminder"><option value="1h" ${state.reminder==='1h'?'selected':''}>Every hour</option><option value="2h" ${state.reminder==='2h'?'selected':''}>Every 2 hours</option><option value="3h" ${state.reminder==='3h'?'selected':''}>Every 3 hours</option><option value="dayparts" ${state.reminder==='dayparts'?'selected':''}>Morning, midday, afternoon & evening</option></select></div><button class="secondary" id="notifyBtn">Enable / test notification</button><div class="notice">${secure?'This page is in a secure context.':'Notifications require HTTPS.'} In this prototype, timed reminders run while the app is open. True background scheduled push on iPhone needs a small push-notification backend.</div></div></div><div class="card cards"><h3>Appearance</h3><div class="fields"><div class="field"><label>Theme</label><select id="themeSelect"><option value="auto" ${state.theme==='auto'?'selected':''}>Automatic day / evening</option><option value="light" ${state.theme==='light'?'selected':''}>Always light</option><option value="dark" ${state.theme==='dark'?'selected':''}>Always dark</option></select></div><div class="field"><label>Evening begins</label><select id="eveningHour">${[17,18,19,20,21].map(h=>`<option value="${h}" ${state.eveningHour===h?'selected':''}>${h>12?h-12:h}:00 PM</option>`).join('')}</select></div></div></div><div class="card cards"><h3>Testing</h3><div class="grid"><button class="secondary" id="backDayBtn">Previous reading</button><button class="secondary" id="nextDayBtn">Next reading</button><button class="secondary" id="resetBtn" style="color:var(--danger)">Reset prototype data</button></div></div>`;
$('#readingMode').onchange=e=>{state.readingMode=e.target.value;save();scheduleReminder()};$('#reminder').onchange=e=>{state.reminder=e.target.value;save();scheduleReminder()};$('#themeSelect').onchange=e=>{state.theme=e.target.value;save();applyTheme()};$('#eveningHour').onchange=e=>{state.eveningHour=+e.target.value;save();applyTheme()};$('#notifyBtn').onclick=enableNotification;$('#backDayBtn').onclick=()=>{state.currentDay=Math.max(1,state.currentDay-1);save();toast('Moved to reading '+state.currentDay)};$('#nextDayBtn').onclick=()=>{state.currentDay=Math.min(PLAN.length,state.currentDay+1);save();toast('Moved to reading '+state.currentDay)};$('#resetBtn').onclick=()=>{if(confirm('Reset saved progress and journal for this prototype?')){localStorage.removeItem(storeKey);location.reload()}}}
$('#settingsBtn').onclick=()=>{renderSettings();$('#settingsModal').classList.add('active')};$('#settingsClose').onclick=()=>$('#settingsModal').classList.remove('active');

async function enableNotification(){if(!('Notification'in window)){toast('Notifications are not supported here');return}try{const p=await Notification.requestPermission();if(p==='granted'){new Notification('Your next reading is ready',{body:nextReminderText()});toast('Test notification sent');scheduleReminder()}else toast('Notification permission not granted')}catch(e){toast('Notifications need HTTPS and browser support')}}
function nextReminderText(){const d=dayObj(),i=nextSegment(d);return i===null?'Today’s Scripture is complete':`${d.segments[i][0]} • ${d.segments[i][1]}`}
function scheduleReminder(){clearInterval(reminderTimer);if(state.readingMode!=='short')return;const ms=state.reminder==='1h'?3600000:state.reminder==='3h'?10800000:7200000;reminderTimer=setInterval(()=>{if(document.visibilityState==='visible'&&'Notification'in window&&Notification.permission==='granted'&&nextSegment(dayObj())!==null)new Notification('Your next reading is ready',{body:nextReminderText()})},ms)}
scheduleReminder();

function initBible(){const b=$('#bookSelect'),c=$('#chapterSelect');BIBLE_BOOKS.forEach(([name])=>b.add(new Option(name,name)));function chapters(){const n=BIBLE_BOOKS.find(x=>x[0]===b.value)[1];c.innerHTML='';for(let i=1;i<=n;i++)c.add(new Option('Chapter '+i,i))}b.onchange=chapters;chapters();$('#openChapterBtn').onclick=()=>openReader(`${b.value} ${c.value}`);$('#openReferenceBtn').onclick=()=>{const r=$('#referenceInput').value.trim();if(r)openReader(r)}}initBible();

$$('.nav button').forEach(b=>b.onclick=()=>{$$('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$$('.screen').forEach(s=>s.classList.remove('active'));$('#'+b.dataset.screen).classList.add('active');if(b.dataset.screen==='journeyScreen')renderJourney();if(b.dataset.screen==='journalScreen')renderJournal()});

function onboarding(){if(state.onboarded)return;$('#onboardingModal').classList.add('active');let step=0,mode='short',theme='auto';function draw(){const root=$('#onboardingContent');if(step===0)root.innerHTML=`<div style="padding-top:42px"><div class="eyebrow">Welcome</div><h1 style="font-size:42px;line-height:1.02;letter-spacing:-.05em">Read the Bible.<br>A little at a time.</h1><p class="sub">One guided journey through Scripture, with progress remembered automatically.</p><div style="height:20px"></div><button class="primary" id="obNext">Begin the Journey</button></div>`;if(step===1)root.innerHTML=`<div style="padding-top:28px"><div class="eyebrow">Reading style</div><h1>How do you want to read?</h1><div class="setupChoice"><button data-mode="daily">One daily reading<br><span class="small">Read the complete portion at once.</span></button><button data-mode="short" class="selected">Short readings<br><span class="small">2–5 minute sections throughout the day.</span></button></div><div style="height:18px"></div><button class="primary" id="obNext">Continue</button></div>`;if(step===2)root.innerHTML=`<div style="padding-top:28px"><div class="eyebrow">Appearance</div><h1>Comfortable day and night.</h1><p class="sub">Automatic uses the calm light palette by day and the midnight palette in the evening.</p><div class="fields"><div class="field"><label>Theme</label><select id="obTheme"><option value="auto">Automatic</option><option value="light">Always light</option><option value="dark">Always dark</option></select></div></div><div style="height:18px"></div><button class="primary" id="obNext">Start Reading</button></div>`;$$('[data-mode]').forEach(x=>x.onclick=()=>{mode=x.dataset.mode;$$('[data-mode]').forEach(y=>y.classList.toggle('selected',y===x))});$('#obTheme')?.addEventListener('change',e=>theme=e.target.value);$('#obNext').onclick=()=>{if(step<2){step++;draw()}else{state.onboarded=true;state.readingMode=mode;state.theme=theme;save();applyTheme();$('#onboardingModal').classList.remove('active')}}}draw()}onboarding();

function escapeHtml(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
renderToday();renderJourney();renderJournal();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('service-worker.js').catch(()=>{});
</script>
</body>
</html>
